<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | SATONG Warehouse Racking</title>
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #0b3a5b 0%, #07283f 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 620px; }
    .code {
      font-size: clamp(90px, 18vw, 160px);
      font-weight: 900;
      color: #f59e0b;
      line-height: 1;
      margin-bottom: 10px;
    }
    h1 {
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 900;
      margin-bottom: 16px;
    }
    p {
      color: #cbd5e1;
      font-size: 16px;
      margin-bottom: 30px;
    }
    .btns {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 15px;
      text-decoration: none;
      transition: .25s;
      border: 2px solid transparent;
    }
    .btn-primary { background: #f59e0b; color: #111827; }
    .btn-primary:hover { background: #fff; transform: translateY(-3px); }
    .btn-outline { border-color: rgba(255,255,255,.7); color: #fff; }
    .btn-outline:hover { background: #fff; color: #0b3a5b; transform: translateY(-3px); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>Sorry, the page you are looking for does not exist or has been moved. Please return to the homepage or browse our products.</p>
    <div class="btns">
      <a href="/" class="btn btn-primary">Back to Home <i class="fa-solid fa-house"></i></a>
      <a href="/products.html" class="btn btn-outline">View Products</a>
      <a href="/contact.html" class="btn btn-outline">Contact Us</a>
    </div>
  </div>
</body>
</html>
